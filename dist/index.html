<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLUM — Бухгалтерия (демо)</title>
  <link rel="stylesheet" href="styles.css?v=50">
</head>
<body>
  <aside class="rail" aria-label="Главная навигация">
    <div class="brand">LOFT<br>HALL</div>
    <button class="rail-item" data-toast="Раздел «Мессенджер» вне этого прототипа"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="8"/><path d="M8 10h8M8 14h5M8 18l-3 2 1-4"/></svg><small>Мессенджер</small></button>
    <button class="rail-item" data-toast="Раздел «Задачи» вне этого прототипа"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2M8 13l3 3 5-6"/></svg><small>Задачи</small></button>
    <button class="rail-item" data-toast="Раздел «Компания» вне этого прототипа"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-4 2.5-6 6-6s6 2 6 6M14 14c3.5-.6 6 1.2 7 4"/></svg><small>Компания</small></button>
    <button class="rail-item" data-toast="Раздел «Брони» вне этого прототипа"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h8"/></svg><small>Брони</small></button>
    <button class="rail-item" data-toast="Раздел «Встречи» вне этого прототипа"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-7.8 4.5"/><path d="M4 3v5h5M12 7v6l-4 2"/></svg><small>Встречи</small></button>
    <button class="rail-item" data-toast="Раздел «Аналитика» вне этого прототипа"><svg viewBox="0 0 24 24"><rect x="4" y="12" width="3" height="8" rx="1"/><rect x="10.5" y="4" width="3" height="16" rx="1"/><rect x="17" y="8" width="3" height="12" rx="1"/></svg><small>Аналитика</small></button>
    <button class="rail-item" data-toast="Раздел «Документы» вне этого прототипа"><svg viewBox="0 0 24 24"><path d="M4 7l6-4 4 3 6-3v14l-6 4-4-3-6 3zM10 3v15M14 6v15"/></svg><small>Документы</small></button>
    <button class="rail-item" data-toast="Раздел «Аттестация» вне этого прототипа"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M21 10v6"/></svg><small>Аттестация</small></button>
    <button class="rail-item" data-toast="Раздел «Реализация» вне этого прототипа"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 16l8-8M8 8l3 3M13 13l3 3"/></svg><small>Реализация</small></button>
    <button class="rail-item" data-toast="Раздел «АХО» вне этого прототипа"><svg viewBox="0 0 24 24"><path d="M12 3v11M9 14h6l2 7H7zM8 18h8M10 14l1-7h2l1 7"/></svg><small>АХО</small></button>
    <button class="rail-item" data-toast="Раздел «Отчёт» вне этого прототипа"><svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v5h5"/><path d="M8 12l3 5M11 12l-3 5M13 12h4M15 12v5"/></svg><small>Отчёт</small></button>
    <button class="rail-item active" data-page="hub"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h1M8 15h2M12 15h2M16 15h1M8 18h2M12 18h2M16 18h1"/></svg><small>Бухгалтерия</small></button>
    <div class="rail-spacer"></div>
    <button class="rail-item" id="settings-button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><small>Настройки</small></button>
  </aside>

  <main class="app-shell">
    <header class="module-head">
      <div>
        <div class="breadcrumbs">Бухгалтерия <span>/</span> <b id="crumb-current">Табель кухни</b></div>
        <nav class="module-tabs" aria-label="Разделы бухгалтерии">
          <button class="module-tab active" data-page="timesheet">Расчётная ведомость</button>
          <button class="module-tab" data-page="advances">Подотчёты</button>
          <button class="module-tab" data-page="reports">Отчёты</button>
        </nav>
      </div>
      <div class="head-actions">
        <span class="demo-badge" id="mode-badge">ДЕМО-ДАННЫЕ</span>
        <label class="role-select">Роль
          <select id="role-select">
            <option>Бухгалтер</option>
            <option>Шеф</option>
            <option>Охрана</option>
          </select>
        </label>
      </div>
    </header>

    <section id="page-root" class="page-root"></section>
  </main>

  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-label="Карточка смены"></aside>
  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true"></section>
  <div id="toast" class="toast hidden"></div>

    <script src="vendor/jszip.min.js"></script>
    <script src="app.js?v=48"></script>
    <script src="registry-excel.js?v=2"></script>
    <script src="security-top-new.js?v=1"></script>
    <script src="chef-date.js?v=2"></script>
    <script src="inline-rate.js?v=3"></script>
    <script src="period-calendar.js?v=4"></script>
    <script src="security-corrections.js?v=1"></script>
    <script src="drawer-back.js?v=1"></script>
    <script src="statement-details.js?v=8"></script>
    <script src="salary-formula.js?v=8"></script>
    <script src="person-card-redesign.js?v=7"></script>
    <script src="employee-identity.js?v=12"></script>
    <script src="extended-time.js?v=2"></script>
    <script src="finance-comments.js?v=1"></script>
    <script src="shift-conflicts.js?v=1"></script>
    <script src="workforce-register.js?v=2"></script>
    <script src="employee-onboarding.js?v=4"></script>
</body>
</html>
